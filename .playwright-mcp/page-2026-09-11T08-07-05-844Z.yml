      - generic [ref=f4e167]: What is Threadly
      - heading [level=2] [ref=f4e168]:
        - text: Threadly is a relationship intelligence app that helps you maintain the
        - generic [ref=f4e169]: connections that matter
        - text: before they fade.
      - paragraph [ref=f4e170]:
        - text: Most people don't lose touch intentionally. They lose touch because modern life is fragmented across too many platforms, too many conversations, and too little memory.
        - generic [ref=f4e171]: Threadly fixes that.
        - text: It builds a living graph of your relationships tracking who you've met, what you discussed, and how warm each connection still is. When someone important starts to drift, Threadly notices first. It surfaces the context of your last conversation and helps you reconnect in a way that feels genuine, not transactional.
